[project]
name = "rsml"
dynamic = ["version"]
description = "a small, self-hosted mailing list system."
readme = "README.md"
license = "BSD-3-Clause"
dependencies = ["aiosmtpd", "aiosmtplib", "flask[async]", "email-validator"]
requires-python = ">=3.11"

[tool.hatch.version]
path = "src/rsml/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[project.scripts]
rsml = "rsml.cli:main"
